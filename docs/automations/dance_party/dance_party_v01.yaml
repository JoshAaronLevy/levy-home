                - light.kitchen_main_4
                - light.kitchen_nook_1
                - light.kitchen_nook_2
                - light.kitchen_nook_3
            data:
              brightness_pct: 100
              transition: 0.1
          - repeat:
              count: 540
              sequence:
                - action: light.turn_on
                  metadata: {}
                  target:
                    entity_id: light.playroom_1
                  data:
                    hs_color:
                      - "{{ range(0, 361) | random }}"
