alias: Dance Party
description: ""
triggers:
  - device_id: ee72ba40cc36a54ae191ef712850239c
    domain: lutron_caseta
    type: press
    subtype: stop
    trigger: device
    id: start_dance_party
  - device_id: ee72ba40cc36a54ae191ef712850239c
    domain: lutron_caseta
    type: press
    subtype: "off"
    trigger: device
    id: stop_dance_party
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: stop_dance_party
        sequence:
          - action: light.turn_off
            metadata: {}
            target:
              entity_id:
                - light.playroom_1
                - light.playroom_2
                - light.playroom_3
                - light.playroom_4
                - light.foyer_entry_1
                - light.foyer_entry_2
                - light.foyer_entry_3
                - light.foyer_stairway_1
                - light.foyer_stairway_2
                - light.foyer_stairway_3
                - light.garage_entry_light
                - light.kitchen_sink
                - light.kitchen_main_1
                - light.kitchen_main_2
                - light.kitchen_main_3
                - light.kitchen_main_4
                - light.kitchen_nook_1
                - light.kitchen_nook_2
                - light.kitchen_nook_3
            data:
              transition: 0.3
      - conditions:
          - condition: trigger
            id: start_dance_party
        sequence:
          - action: light.turn_on
            metadata: {}
            target:
              entity_id:
                - light.playroom_1
                - light.playroom_2
                - light.playroom_3
                - light.playroom_4
